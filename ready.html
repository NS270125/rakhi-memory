<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait... 😂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050b24, #101b4d, #050b24);
            color: white;
            overflow: hidden;
        }

        .funny {
            text-align: center;
            animation: pop 0.8s ease;
        }

        .emoji {
            font-size: 75px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        h1 {
            font-size: 38px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
    </style>
</head>

<body>

    <div class="funny">
        <div class="emoji">😏😂</div>
        <h1>Special chahiye tujhe?</h1>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "are-you-ready.html";
        }, 3000);
    </script>

</body>
</html>
