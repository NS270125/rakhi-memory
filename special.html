<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Special ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050b24, #101b4d, #050b24);
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            animation: fadeIn 1.5s ease;
        }

        .heart {
            font-size: 65px;
            animation: heartbeat 1.4s infinite;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .subtitle {
            font-size: 20px;
            opacity: 0.85;
            margin-bottom: 35px;
        }

        .special {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 35px;
            animation: glow 2s infinite alternate;
        }

        .next-btn {
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, #ff4f81, #ff85a8);
            box-shadow: 0 0 20px rgba(255, 90, 130, 0.5);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 90, 130, 0.8);
        }

        .sparkle {
            position: absolute;
            font-size: 20px;
            animation: float 5s linear infinite;
            opacity: 0.7;
        }

        .s1 { left: 10%; top: 80%; animation-delay: 0s; }
        .s2 { left: 25%; top: 90%; animation-delay: 1s; }
        .s3 { left: 70%; top: 85%; animation-delay: 2s; }
        .s4 { left: 85%; top: 75%; animation-delay: 3s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.18);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px white;
            }
            to {
                text-shadow: 0 0 25px #ff7fa3;
            }
        }

        @keyframes float {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            to {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="sparkle s1">✨</div>
    <div class="sparkle s2">💖</div>
    <div class="sparkle s3">✨</div>
    <div class="sparkle s4">💫</div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Something Special For You</h1>

        

        <div class="special">
            Something Special ✨
        </div>

        <button class="next-btn" onclick="goNext()">
            Let's Continue 💖
        </button>

    </div>

    <script>
    function goNext() {
        window.location.href = "ready.html";
    }
</script>

</body>
</html>
