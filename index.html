<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Raksha Bandhan 🎀</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #05091c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
.continue-btn {
    margin-top: 30px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: #ff416c;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
        .container {
            text-align: center;
        }

        .rakhi {
            font-size: 90px;
            margin-bottom: 25px;
            animation: glow 2s infinite alternate;
        }

        h1 {
            font-size: 45px;
            margin: 0;
        }

        h1 span {
            color: #ff416c;
        }

        @keyframes glow {
            from {
                transform: scale(0.9);
            }

            to {
                transform: scale(1.1);
            }
        }
.special-screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #2525d8, #741f9b, #b0125c);
}

.special-content {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.special-content h2 {
    margin: 0;
    font-size: 58px;
    color: #f5ff21;
    font-weight: bold;
}

.special-content p {
    margin-top: 25px;
    font-size: 25px;
    color: #f5ff21;
}

.start-btn {
    margin-top: 20px;
    padding: 18px 55px;
    border: none;
    border-radius: 50px;
    background: #08d5e8;
    color: #ff1493;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}
    </style>

</head>


<body>

    <div class="container">

        <div class="rakhi">
            🎀
        </div>

        <h1>
            Happy Raksha Bandhan<br>
            <span>to My Dear Sister ❤️</span>
        </h1>
<button class="continue-btn" id="continueBtn">
    Continue 💖
</button>
    </div>
<script>
document.getElementById("continueBtn").addEventListener("click", function () {
    window.location.href = "special.html";
});
</script>
</body>

</html>
